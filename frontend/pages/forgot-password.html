<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password — Msomi Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/theme.css" />
<link rel="stylesheet" href="../css/app.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
</head>
<body>
<div class="auth-shell">
  <div class="auth-visual">
    <a href="../index.html" class="brand" style="color:#fff;position:relative;z-index:1;">
      <span class="logo-mark" style="background:transparent;"><img src="../photo/logo-icon.png" alt="Msomi Hub logo" /></span>
      Msomi Hub
    </a>
    <div style="position:relative;z-index:1;">
      <h2 style="color:#fff;font-size:1.9rem;margin-bottom:1rem;max-width:420px;">Forgot your password? It happens.</h2>
      <p style="color:var(--slate-300);max-width:400px;line-height:1.6;">Enter your email and we'll help you get back into your account securely.</p>
    </div>
    <div style="position:relative;z-index:1;color:var(--slate-400);font-size:.82rem;">© <span id="year1"></span> Msomi Hub</div>
  </div>

  <div class="auth-form-side">
    <div class="auth-card">
      <div class="flex justify-between items-center mb-4">
        <a href="login.html" class="btn btn-ghost btn-sm"><i data-lucide="arrow-left" class="icon"></i> Back</a>
        <button class="icon-btn" id="themeToggle" aria-label="Toggle theme"></button>
      </div>
      <div class="f-icon icon-tint-gold mb-4" style="width:56px;height:56px;"><i data-lucide="key-round" class="icon"></i></div>
      <h1 style="font-size:1.6rem;margin-bottom:.4rem;">Reset your password</h1>
      <p class="text-secondary mb-4">We'll send reset instructions to your email address.</p>

      <form id="forgot-form">
        <div class="field">
          <label for="email">Email address</label>
          <div class="input-wrap">
            <i data-lucide="mail" class="icon"></i>
            <input type="email" id="email" name="email" placeholder="you@student.ac.ke" required />
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg mt-4">
          <i data-lucide="send" class="icon"></i> Send Reset Instructions
        </button>
      </form>

      <p class="text-center text-sm mt-6">
        Remembered it? <a href="login.html" style="color:var(--gold-600);font-weight:700;">Back to login</a>
      </p>
    </div>
  </div>
</div>

<div id="toast-stack"></div>
<script type="module" src="../js/theme.js"></script>
<script type="module" src="../js/auth.js"></script>
<script>document.getElementById('year1').textContent = new Date().getFullYear();</script>
</body>
</html>
