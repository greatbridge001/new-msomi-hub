<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Opportunities — Msomi Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/theme.css" />
<link rel="stylesheet" href="../css/app.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
</head>
<body>
<div class="app-shell">
  <div id="sidebarMount"></div>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="main-col">
    <div id="topbarMount"></div>
    <main class="page-content">
      <div class="page-header">
        <div><h1>Opportunities</h1><p>Internships, attachments, jobs and competitions for students.</p></div>
      </div>

      <div class="card card-pad mb-4">
        <div class="flex gap-3" style="flex-wrap:wrap;">
          <div class="input-wrap" style="flex:1;min-width:220px;">
            <i data-lucide="search" class="icon"></i>
            <input type="text" id="searchInput" placeholder="Search opportunities..." />
          </div>
        </div>
        <div class="flex gap-2 mt-4" id="typeTabs" style="flex-wrap:wrap;">
          <button class="btn btn-dark btn-sm" data-type="">All</button>
          <button class="btn btn-outline btn-sm" data-type="internship">Internships</button>
          <button class="btn btn-outline btn-sm" data-type="attachment">Attachments</button>
          <button class="btn btn-outline btn-sm" data-type="graduate_trainee">Graduate Trainee</button>
          <button class="btn btn-outline btn-sm" data-type="online_job">Online Jobs</button>
          <button class="btn btn-outline btn-sm" data-type="competition">Competitions</button>
        </div>
      </div>

      <div class="grid grid-2" id="oppGrid">
        <div class="loading-row" style="grid-column:1/-1;"><span class="spinner"></span> Loading opportunities...</div>
      </div>
    </main>
  </div>
</div>

<div id="toast-stack"></div>
<script type="module" src="../js/theme.js"></script>
<script type="module" src="../js/opportunities.js"></script>
</body>
</html>
