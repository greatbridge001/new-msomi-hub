<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Budget Tracker — Msomi Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/theme.css" />
<link rel="stylesheet" href="../css/app.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
</head>
<body>
<div class="app-shell">
  <div id="sidebarMount"></div>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="main-col">
    <div id="topbarMount"></div>
    <main class="page-content">
      <div class="page-header">
        <div><h1>Budget Tracker</h1><p>Make your HELB &amp; allowance last the whole semester.</p></div>
        <div class="flex gap-2">
          <input type="month" id="monthPicker" style="width:auto;" />
          <button class="btn btn-primary" id="addEntryBtn"><i data-lucide="plus" class="icon"></i> Add Entry</button>
        </div>
      </div>

      <div class="grid grid-3 mb-4">
        <div class="card stat-card">
          <div class="stat-icon icon-tint-green"><i data-lucide="arrow-down-circle" class="icon"></i></div>
          <div class="stat-value" id="incomeValue" style="color:var(--emerald-600);">—</div>
          <div class="stat-label">Income this month</div>
        </div>
        <div class="card stat-card">
          <div class="stat-icon icon-tint-rose"><i data-lucide="arrow-up-circle" class="icon"></i></div>
          <div class="stat-value" id="expenseValue" style="color:var(--rose-600);">—</div>
          <div class="stat-label">Expenses this month</div>
        </div>
        <div class="card stat-card" style="background:var(--brand-strong);color:#fff;">
          <div class="stat-icon" style="background:rgba(212,160,23,0.18);color:var(--gold-300);"><i data-lucide="wallet" class="icon"></i></div>
          <div class="stat-value" id="balanceValue" style="color:var(--gold-300);">—</div>
          <div class="stat-label" style="color:var(--slate-300);">Balance remaining</div>
        </div>
      </div>

      <div class="card card-pad mb-4">
        <h3 style="font-size:1.05rem;margin-bottom:1rem;">Spending by Category</h3>
        <div id="categoryBreakdown"><div class="loading-row"><span class="spinner"></span> Loading...</div></div>
      </div>

      <div class="card card-pad">
        <h3 style="font-size:1.05rem;margin-bottom:1rem;">Transaction History</h3>
        <div id="entriesList"><div class="loading-row"><span class="spinner"></span> Loading...</div></div>
      </div>
    </main>
  </div>
</div>

<div class="modal-backdrop" id="entryModal" style="display:none;">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle" style="font-size:1.1rem;">Add Entry</h3>
      <button class="icon-btn" id="closeModal"><i data-lucide="x" class="icon"></i></button>
    </div>
    <form id="entryForm">
      <div class="modal-body">
        <input type="hidden" id="entryId" />
        <div class="field">
          <label>Type</label>
          <div class="flex gap-2">
            <label class="btn btn-outline btn-block" style="cursor:pointer;">
              <input type="radio" name="entry_type" value="income" style="width:auto;margin-right:6px;" /> Income
            </label>
            <label class="btn btn-outline btn-block" style="cursor:pointer;">
              <input type="radio" name="entry_type" value="expense" checked style="width:auto;margin-right:6px;" /> Expense
            </label>
          </div>
        </div>
        <div class="field">
          <label for="amount">Amount (KES)</label>
          <input type="number" id="amount" min="1" step="0.01" placeholder="e.g. 500" required />
        </div>
        <div class="field">
          <label for="category">Category</label>
          <select id="category" required>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Rent">Rent</option>
            <option value="Airtime & Data">Airtime & Data</option>
            <option value="Books & Supplies">Books & Supplies</option>
            <option value="Fees">Fees</option>
            <option value="Entertainment">Entertainment</option>
            <option value="HELB Disbursement">HELB Disbursement</option>
            <option value="Allowance">Allowance</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="field">
          <label for="record_date">Date</label>
          <input type="date" id="record_date" required />
        </div>
        <div class="field">
          <label for="description">Description (optional)</label>
          <input type="text" id="description" placeholder="e.g. Lunch at cafeteria" />
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" id="cancelModal">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">Save Entry</button>
      </div>
    </form>
  </div>
</div>

<div id="toast-stack"></div>
<script type="module" src="../js/theme.js"></script>
<script type="module" src="../js/budget.js"></script>
</body>
</html>
