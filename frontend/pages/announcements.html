<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Announcements — Msomi Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/theme.css" />
<link rel="stylesheet" href="../css/app.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
</head>
<body>
<div class="app-shell">
  <div id="sidebarMount"></div>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="main-col">
    <div id="topbarMount"></div>
    <main class="page-content">
      <div class="page-header">
        <div><h1>Announcements</h1><p>Platform news and important updates from the Msomi Hub team.</p></div>
      </div>

      <div class="card card-pad mb-4">
        <div class="input-wrap">
          <i data-lucide="search" class="icon"></i>
          <input type="text" id="searchInput" placeholder="Search announcements..." />
        </div>
      </div>

      <div class="flex flex-col gap-3" id="announcementsList">
        <div class="loading-row"><span class="spinner"></span> Loading announcements...</div>
      </div>
    </main>
  </div>
</div>

<div id="toast-stack"></div>
<script type="module" src="../js/theme.js"></script>
<script type="module" src="../js/announcements.js"></script>
</body>
</html>
