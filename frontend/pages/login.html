<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log In — Msomi Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/theme.css" />
<link rel="stylesheet" href="../css/app.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
</head>
<body>
<div class="auth-shell">
  <div class="auth-visual">
    <a href="../index.html" class="brand" style="color:#fff;position:relative;z-index:1;">
      <span class="logo-mark" style="background:transparent;"><img src="../photo/logo-icon.png" alt="Msomi Hub logo" /></span>
      Msomi Hub
    </a>
    <div style="position:relative;z-index:1;">
      <h2 style="color:#fff;font-size:1.9rem;margin-bottom:1rem;max-width:420px;">Welcome back to your daily student hub.</h2>
      <p style="color:var(--slate-300);max-width:400px;line-height:1.6;">Your timetable, budget, GPA and HELB updates are exactly where you left them.</p>
      <div class="flex gap-3 mt-6">
        <div class="avatar" style="border:2px solid var(--navy-900);">FN</div>
        <div class="avatar" style="border:2px solid var(--navy-900);margin-left:-16px;">BK</div>
        <div class="avatar" style="border:2px solid var(--navy-900);margin-left:-16px;background:var(--gold-500);color:var(--navy-950);">AW</div>
        <span class="text-sm" style="color:var(--slate-300);align-self:center;margin-left:.5rem;">Joined by 4,300+ students</span>
      </div>
    </div>
    <div style="position:relative;z-index:1;color:var(--slate-400);font-size:.82rem;">© <span id="year1"></span> Msomi Hub</div>
  </div>

  <div class="auth-form-side">
    <div class="auth-card">
      <div class="flex justify-between items-center mb-4">
        <div></div>
        <button class="icon-btn" id="themeToggle" aria-label="Toggle theme"></button>
      </div>
      <h1 style="font-size:1.7rem;margin-bottom:.4rem;">Log in to your account</h1>
      <p class="text-secondary mb-4">Pick up right where you left off.</p>

      <form id="login-form">
        <div class="field">
          <label for="email">Email address</label>
          <div class="input-wrap">
            <i data-lucide="mail" class="icon"></i>
            <input type="email" id="email" name="email" placeholder="you@student.ac.ke" required />
          </div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <i data-lucide="lock" class="icon"></i>
            <input type="password" id="password" name="password" placeholder="••••••••" required />
            <button type="button" class="toggle-visibility"><i data-lucide="eye" class="icon"></i></button>
          </div>
          <div class="text-sm mt-2" style="text-align:right;">
            <a href="forgot-password.html" style="color:var(--gold-600);font-weight:600;">Forgot password?</a>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg mt-4">
          <i data-lucide="log-in" class="icon"></i> Log In
        </button>
      </form>

      <p class="text-center text-sm mt-6">
        New to Msomi Hub? <a href="register.html" style="color:var(--gold-600);font-weight:700;">Create a free account</a>
      </p>
    </div>
  </div>
</div>

<div id="toast-stack"></div>
<script type="module" src="../js/theme.js"></script>
<script type="module" src="../js/auth.js"></script>
<script>document.getElementById('year1').textContent = new Date().getFullYear();</script>
</body>
</html>
